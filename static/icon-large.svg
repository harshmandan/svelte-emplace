<svg
	xmlns="http://www.w3.org/2000/svg"
	viewBox="0 0 64 64"
	width="64"
	height="64"
	fill="none"
	stroke="currentColor"
	stroke-width="1"
	stroke-linejoin="bevel"
	role="img"
	aria-label="svelte-emplace"
>
	<style>
		/* Fixed palette, not theme-aware: the tile is always dark, so the mark is
		   always light. `--paper` matches the tile so the planes still occlude. */
		:root { color: #ededed; --paper: #0a0a0a; }
	</style>

	<!-- stroke="none" matters: without it the rect inherits the root stroke and
	     draws a light frame around the tile. -->
	<rect width="64" height="64" fill="#0a0a0a" stroke="none" />

	<!-- Three overlapping layers, drawn back to front. The filled plane is the
	     layer your content is made in. -->
	<polygon points="16,38.5 32,33 48,38.5 32,44" fill="var(--paper)" />
	<polygon points="16,32 32,26.5 48,32 32,37.5" fill="var(--paper)" stroke-dasharray="2.5 2" />
	<polygon points="16,25.5 32,20 48,25.5 32,31" fill="currentColor" />
</svg>
