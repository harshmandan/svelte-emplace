<svg
	xmlns="http://www.w3.org/2000/svg"
	viewBox="0 0 64 64"
	width="64"
	height="64"
	fill="none"
	stroke="currentColor"
	stroke-width="1.5"
	stroke-linejoin="bevel"
	role="img"
	aria-label="svelte-emplace"
>
	<style>
		/* Fixed palette, not theme-aware: the tile is always dark, so the mark is
		   always light. `--paper` matches the tile so the planes still occlude. */
		:root { color: #ededed; --paper: #0a0a0a; }
	</style>

	<rect width="64" height="64" fill="#0a0a0a" />

	<!-- Three overlapping layers, drawn back to front. The filled plane is the
	     layer your content is made in. -->
	<polygon points="12,41.5 32,34.5 52,41.5 32,48.5" fill="var(--paper)" />
	<polygon points="12,32 32,25 52,32 32,39" fill="var(--paper)" stroke-dasharray="4 3" />
	<polygon points="12,22.5 32,15.5 52,22.5 32,29.5" fill="currentColor" />
</svg>
